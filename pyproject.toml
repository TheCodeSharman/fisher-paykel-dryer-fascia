[project]
name = "fascia"
version = "0.1.0"
description = "Replacement control-board fascia panel for a Fisher & Paykel dryer"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "build123d>=0.11.1",
    "ocp-vscode>=4.0.1",
]

[project.scripts]
fascia-build = "fascia.build:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fascia"]
